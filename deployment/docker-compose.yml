version: '3.8'

services:
  agent-researcher:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: agent-researcher
    volumes:
      - ../output:/app/output
      - ../data:/app/data
      - ../config/settings.yaml:/app/config/settings.yaml
    ports:
      - "9090:9090"
    environment:
      - PYTHONUNBUFFERED=1
    command: [ "--continuous", "--interval", "15" ]

  prometheus:
    image: prom/prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana

volumes:
  grafana-storage:
