[tool.poetry]
name = "agent-researcher"
version = "0.1.0"
description = "Autonomous research agent system with 15 specialized nodes"
authors = ["Agent Researcher Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
# Orchestration
langgraph = "^0.2.0"
langchain = "^0.2.0"
langchain-community = "^0.2.0"
langchain-core = "^0.2.0"

# LLM
ollama = "^0.3.0"

# Data Processing
scrapy = "^2.11.0"
beautifulsoup4 = "^4.12.0"
pandas = "^2.2.0"
spacy = "^3.7.0"
nltk = "^3.8.0"

# Storage
chromadb = "^0.4.0"

# Document Generation
jinja2 = "^3.1.0"
weasyprint = "^62.0"
python-docx = "^1.1.0"
markdown = "^3.5.0"

# Monitoring
prometheus-client = "^0.20.0"
loguru = "^0.7.0"

# Utilities
pyyaml = "^6.0"
pydantic = "^2.6.0"
httpx = "^0.27.0"
aiofiles = "^23.2.0"
apscheduler = "^3.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
black = "^24.0.0"
ruff = "^0.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
agent-researcher = "src.main:main"
